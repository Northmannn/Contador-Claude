name: Playlist matinal (diária)

# Alvo: playlist pronta antes de ~05:00 de Brasília. O cron do GitHub para este
# repositório vem atrasando 5-6h (medido em set/2026: agendado 03:23 BRT, rodou
# 08:10-10:00 BRT). Por isso agendamos às 00:23 UTC (21:23 BRT da noite
# anterior): com o atraso atual chega ~02:30-03:30; sem atraso, 21:23 — nos dois
# casos está pronta ao acordar. Minuto "quebrado" pra fugir do pico.
# Atualiza apenas as playlists marcadas com "daily: true" no config.
on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

jobs:
  morning:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pra commitar o aprendizado (data/) de volta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Atualizar playlist(s) diária(s)
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python main.py sync --daily

      - name: Salvar aprendizado (o que você removeu)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore: atualiza aprendizado de gosto [skip ci]"
          git push
