name: Playlist matinal (diária)

# Alvo: playlist pronta ~05:00 de Brasília. O cron do GitHub atrasa 1-3h em
# horários de pico (medido nos runs reais), então agendamos às 06:23 UTC
# (03:23 BRT), em minuto "quebrado" fora do pico — com o atraso típico, a
# atualização chega entre ~04:50 e ~06:30 BRT.
# Atualiza apenas as playlists marcadas com "daily: true" no config.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Atualizar playlist(s) diária(s)
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python main.py sync --daily
