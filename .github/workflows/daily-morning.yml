name: Playlist matinal (diária)

# Roda todo dia às 05:00 de Brasília (08:00 UTC; o Brasil é UTC-3 o ano todo).
# Atualiza apenas as playlists marcadas com "daily: true" no config — hoje, a
# "🌅 Bom Dia, Motivação": zera e repõe 15 músicas novas pra surpreender.
# Obs.: o agendamento do GitHub pode atrasar alguns minutos em horário de pico.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Atualizar playlist(s) diária(s)
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python main.py sync --daily
