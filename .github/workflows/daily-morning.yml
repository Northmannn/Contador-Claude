name: Playlist diária (manhã e noite)

# A diária se renova 2x ao dia, em JANELAS (hora de Brasília, ver `daily_slots`
# em config/playlists.yaml): manhã 02h–12h e noite 17h–24h.
#
# Por que de hora em hora: o cron do GitHub neste repositório atrasa 5-6h e às
# vezes descarta execuções (medido em set/2026). Disparando toda hora, a 1ª
# execução que cair dentro da janela gera a lista; as outras da mesma janela só
# conferem (`--slot-guard`) e saem em segundos, sem chamar o Spotify.
# Disparo manual (workflow_dispatch) sempre gera e marca a janela. Por padrão
# também GRAVA o rodízio (out/2026: lista manual sem gravar voltava inteira na
# geração seguinte = repetição no mesmo dia). Desmarque `force` só pra testar
# sem queimar a semana.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      catalog_budget:
        description: "Quantos artistas atualizar no catálogo nesta execução"
        required: false
        default: "12"
      force:
        description: "Gravar esta geração no rodízio de 7 dias (padrão: sim, igual ao cron). Desmarque só pra testar sem queimar a semana."
        required: false
        type: boolean
        default: true

# Uma execução por vez em tudo que grava data/ (diária + manual).
concurrency:
  group: spotify-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pra commitar o aprendizado (data/) de volta
    steps:
      - name: Checkout (ponta da branch, não o commit do agendamento)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -q -r requirements.txt

      - name: Atualizar playlist(s) diária(s)
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          CATALOG_BUDGET: ${{ inputs.catalog_budget || '12' }}
          SLOT_GUARD: ${{ github.event_name == 'schedule' && '1' || '0' }}
          RECORD_ROTATION: ${{ (github.event_name == 'schedule' || inputs.force == true || inputs.force == 'true') && '1' || '0' }}
        run: |
          args=(sync --daily)
          if [ "$SLOT_GUARD" = "1" ]; then args+=(--slot-guard); fi
          if [ "$RECORD_ROTATION" != "1" ]; then args+=(--no-record-rotation); fi
          python main.py "${args[@]}"

      - name: Fiscal de repetição (relatório no resumo da execução)
        if: always()
        run: python main.py audit --days 7 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Salvar aprendizado, rodízio e catálogo (data/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then echo "nada a salvar"; exit 0; fi
          git commit -q -m "chore: atualiza aprendizado de gosto [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
