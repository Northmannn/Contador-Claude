name: Diagnóstico (detector de remoções)

# Só imprime o que a API devolve ao ler a playlist — não altera nada, não commita.
on:
  workflow_dispatch:
    inputs:
      playlist:
        description: "Nome exato da playlist"
        required: true
        type: string
        default: "🌅 Bom Dia, Motivação"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnosticar
        env:
          PLAYLIST: ${{ inputs.playlist }}
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python main.py diagnose "$PLAYLIST"
