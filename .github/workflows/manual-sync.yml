name: Gerar uma playlist (manual)

# Dispara sob demanda (pelo GitHub ou pelo Claude) e gera UMA playlist pelo
# nome exato. Ótimo pra quem está no celular e não consegue rodar no PC.
on:
  workflow_dispatch:
    inputs:
      playlist:
        description: "Nome exato da playlist (ex: 🪗 Forró das Boas)"
        required: true
        type: string
      force:
        description: "Gravar as músicas no rodízio de 7 dias. Sem isso, a playlist atualiza mas não queima a semana (importante na Bom Dia)."
        required: false
        type: boolean
        default: false

# Mesma fila da diária: nunca duas execuções gravando data/ ao mesmo tempo.
concurrency:
  group: spotify-data
  cancel-in-progress: false

jobs:
  manual:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pra commitar o aprendizado (data/) de volta
    steps:
      - name: Checkout (ponta da branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -q -r requirements.txt

      - name: Gerar a playlist escolhida
        env:
          PLAYLIST: ${{ inputs.playlist }}
          RECORD_ROTATION: ${{ (inputs.force == true || inputs.force == 'true') && '1' || '0' }}
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          args=(sync --only "$PLAYLIST")
          if [ "$RECORD_ROTATION" != "1" ]; then args+=(--no-record-rotation); fi
          python main.py "${args[@]}"

      - name: Salvar aprendizado, rodízio e catálogo (data/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then echo "nada a salvar"; exit 0; fi
          git commit -q -m "chore: atualiza aprendizado de gosto [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
