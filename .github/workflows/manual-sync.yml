name: Gerar uma playlist (manual)

# Dispara sob demanda (pelo GitHub ou pelo Claude) e gera UMA playlist pelo
# nome exato. Ótimo pra quem está no celular e não consegue rodar no PC.
on:
  workflow_dispatch:
    inputs:
      playlist:
        description: "Nome exato da playlist (ex: 🪗 Forró das Boas)"
        required: true
        type: string

jobs:
  manual:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pra commitar o aprendizado (data/) de volta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar a playlist escolhida
        env:
          PLAYLIST: ${{ inputs.playlist }}
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python main.py sync --only "$PLAYLIST"

      - name: Salvar aprendizado (o que você removeu)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore: atualiza aprendizado de gosto [skip ci]"
          git push
