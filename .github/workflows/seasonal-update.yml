name: Atualização sazonal das playlists

# Roda automaticamente toda segunda-feira às 09:00 UTC (06:00 no horário de Brasília).
# Como o script só atualiza playlists "da estação atual" (ou [always]),
# a troca sazonal acontece sozinha quando vira a estação.
# Também dá pra disparar manualmente pela aba Actions do GitHub.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Atualizar TODAS as playlists (ignorar a estação)"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Sincronizar playlists
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python main.py sync --force
          else
            python main.py sync
          fi
