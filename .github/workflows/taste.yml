name: Meu gosto (top artistas e músicas)

# Só imprime seus artistas/músicas mais ouvidos (3 janelas). Não altera nada.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Despejo completo (perfil): trechos de nome das playlists a ler, separados por vírgula. Vazio = só as mais ouvidas."
        required: false
        default: ""
      max_tracks:
        description: "Faixas por playlist no despejo"
        required: false
        default: "150"

jobs:
  taste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mostrar gosto
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          PROFILE: ${{ inputs.profile }}
          MAX_TRACKS: ${{ inputs.max_tracks || '150' }}
        run: |
          if [ -n "$PROFILE" ]; then
            python main.py profile --playlists "$PROFILE" --max-tracks "$MAX_TRACKS"
          else
            python main.py taste
          fi
