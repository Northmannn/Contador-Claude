  # =====================================================================
  # 🌅 BOM DIA — DIÁRIA às 5h: pra treinar SEGUNDA VOZ no carro.
  # Regras v2 (definidas com o usuário): melódica e contagiante (sertanejo,
  # pagode, samba, MPB, axé...), só português (inglês só se já for curtida),
  # maioria conhecida + 3 novas do próprio gosto, sem repetir artista, sem
  # rock/metal/funk/rap/melancolia, e aprende com o que ele remove.
  # =====================================================================
  - name: "🌅 Bom Dia, Motivação"
    description: "Pra treinar segunda voz no carro: melódica, contagiante, em português. Conhecidas + 3 novas por dia."
    public: false
    size: 15
    seasons: [always]
    daily: true            # entra no fluxo diário (sync --daily), não no sazonal
    # ---- REGRAS (definidas com você) ----
    sing_along: true       # maioria de músicas que você conhece (top tracks + curtidas)
    new_tracks: 3          # pelo menos 3 novas por dia, sempre dentro do seu escopo
    max_per_artist: 1      # nunca repete artista
    portuguese_only: true  # só português; inglês apenas se JÁ estiver nas curtidas
    learn_removals: true   # o que você tira vira "não gosto" (com guarda anti-bug)
    seed_from_taste: true  # as novas saem dos SEUS artistas (não de gente aleatória)
    mode: discovery
    # Melódico e contagiante — o que funciona pra segunda voz (terças):
    match_genres: [sertanejo, pagode, samba, mpb, "axé", axe, arrocha, "forró", forro,
                   "brazilian", nacional, "pop brasileiro", "samba rock", "brega"]
    # Fora de manhã: nada pesado, nada melancólico, nada funk/rap
    exclude_genres: ["rock nacional", "brazilian rock", "hard rock", "classic rock",
                     "alternative rock", metal, thrash, punk, hardcore, grunge,
                     funk, "funk carioca", "funk brasileiro", "funk mtg", "funk ostentação",
                     rap, trap, "hip hop", "brazilian hip hop", drill,
                     "bossa nova", "lo-fi", ambient, jazz]
    exclude_artists:       # artistas vetados (é só me passar mais nomes):
      - "Legião Urbana"
    queries:               # reforço pras novas (só se faltar material do seu gosto):
      - "sertanejo animado"
      - "pagode animado"
      - "samba alegre"

  # =====================================================================
  # 🌙 HIPERFOCO NOTURNO — INTENSO e EUFÓRICO pra madrugada de foco.
  # Em português, ritmo envolvente, gêneros naturalmente acima de ~100 BPM
  # (axé, rock nacional pesado, pop/dance BR, pagode/forró animado).
  # Sem rap e sem o lado melódico/MPB. Sempre com faixas novas (surpresa).
  # OBS: a Spotify removeu o dado de BPM da API (audio features) p/ apps novos,
  # então o alvo de >100 BPM é feito por GÊNERO/ARTISTA, não por medição exata.
  # =====================================================================
  - name: "🌙 Hiperfoco Noturno"
    description: "Intenso e eufórico pra virar a madrugada no foco. Português, ritmo pra cima, acima de 100 BPM."
    public: false
    size: 40
    seasons: [always]
    mode: discovery
    seed_from_taste: true   # usa seus artistas, mas só os energéticos (match abaixo)
    exclude_heard: true     # sempre faixas novas (surpresa)
    # Só semeia a partir dos seus gostos mais energéticos...
    match_genres: [rock, "rock nacional", "brazilian rock", punk, "hardcore", "pop rock",
                   axé, pagode, pop, dance, "forró", "piseiro", "samba rock"]
    # ...e nunca dos gêneros calmos/melódicos nem rap.
    exclude_genres: [mpb, "bossa nova", jazz, "samba jazz", "lo-fi", ambient, brega,
                     "samba de raiz", rap, "hip hop", trap, "brazilian hip hop", drill]
    queries:
      - "axé"
      - "rock nacional pesado"
      - "pop rock brasileiro animado"
      - "pagode animado"
      - "forró animado"
      - "hits pra dançar brasil"
      - "rock nacional anos 2000"
      - "agito brasil"
    artist_seeds:
      # axé / festa eufórica (BPM alto)
      - "Ivete Sangalo"
      - "Chiclete com Banana"
      - "Daniela Mercury"
      - "Timbalada"
      - "Léo Santana"
      - "Bell Marques"
      # rock nacional intenso
      - "CPM 22"
      - "Raimundos"
      - "Charlie Brown Jr."
      - "Capital Inicial"
      - "Pitty"
      - "NX Zero"
      - "Detonautas"
      # pop / dance em português
      - "Pabllo Vittar"
      - "Anitta"

  # =====================================================================
  # 💛 ACONCHEGO ANIMADO — feita do SEU histórico real: inclui suas músicas
  # mais ouvidas (letras que você já ama = acolhimento), animada, sem rap.
  # Mantém o que você já escuta (NÃO exclui ouvidas) pra ser familiar.
  # =====================================================================
  - name: "💛 Aconchego Animado"
    description: "Suas mais ouvidas + artistas que você ama. Animada e com letras que te acolhem."
    public: false
    size: 45
    seasons: [always]
    mode: discovery
    seed_from_taste: true       # seus artistas mais ouvidos (últimos anos + recentes)
    include_top_tracks: true    # e suas PRÓPRIAS músicas mais tocadas
    exclude_heard: false        # mantém o familiar/acolhedor (não tira o conhecido)
    hits_only: true             # as músicas marcantes dos seus artistas
    match_genres: []            # todos os seus estilos...
    exclude_genres: [rap, "hip hop", trap, "brazilian hip hop", drill]  # ...menos rap
    # Reforço caso falte material (gêneros animados e cheios de letra do seu perfil).
    queries:
      - "pagode animado"
      - "sertanejo pra cantar"
      - "samba animado"

  # =====================================================================
  # 💛 NO MESMO CLIMA (DESCOBERTAS) — pega seus artistas mais ouvidos e
  # entrega músicas NOVAS na mesma vibe/intensidade (faixas deles que você
  # ainda não ouviu + mesmo gênero), EXCLUINDO tudo que você já escutou.
  # OBS: "parecida" aqui = mesmos artistas/gêneros (a Spotify removeu o
  # endpoint de recomendação/artistas relacionados pra apps novos).
  # =====================================================================
  - name: "💛 No Mesmo Clima — Descobertas"
    description: "Seu gosto, músicas novas: mesma vibe e intensidade, sem repetir o que você já ouve."
    public: false
    size: 40
    seasons: [always]
    mode: discovery
    seed_from_taste: true        # parte dos seus artistas mais ouvidos
    include_top_tracks: false    # NÃO replica suas músicas — quer descoberta
    exclude_heard: true          # remove tudo que você já escutou (só coisa nova)
    hits_only: false             # inclui faixas menos óbvias dos seus artistas
    match_genres: []             # todos os seus estilos...
    exclude_genres: [rap, "hip hop", trap, "brazilian hip hop", drill]  # ...menos rap
    queries:
      - "pagode"
      - "samba"
      - "sertanejo"
      - "pop rock nacional"

