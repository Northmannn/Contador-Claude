# =====================================================================
# Configuração das suas playlists.
#
# Cada playlist é montada por BUSCA na Spotify a partir das "queries",
# "genres", "artist_seeds" e "year_range" que você definir aqui.
# Edite à vontade — é aqui que mora a "vibe" de cada ocasião.
#
# Campos por playlist:
#   name         (obrigatório) nome exato da playlist na sua conta
#   description  texto que aparece na playlist
#   public       true/false (padrão: false)
#   size         quantas faixas (padrão: 30)
#   seasons      quando atualizar: [always] ou combinações de
#                summer / autumn / winter / spring
#   queries      termos de busca livres ("treino", "café da manhã", etc.)
#   genres       gêneros do Spotify (ex: acoustic, pop, sertanejo)
#   artist_seeds artistas cujas top tracks entram na seleção
#   year_range   filtro de ano, ex: "2010-2020"
#   market       país (padrão: o global abaixo)
# =====================================================================

hemisphere: southern   # Brasil = southern (estações invertidas vs. EUA/Europa)
market: BR

playlists:
  - name: "☀️ Verão na Praia"
    description: "Energia alta pra dias quentes. Atualizada a cada verão."
    public: false
    size: 30
    seasons: [summer]
    queries:
      - "summer beach vibes"
      - "funk verão"
      - "reggae brasil"
    genres: [pop, reggae]

  - name: "🍂 Outono Aconchegante"
    description: "Trilha calma pra dias mais frescos. Atualizada a cada outono."
    public: false
    size: 30
    seasons: [autumn]
    queries:
      - "indie folk acoustic"
      - "mpb suave"
    genres: [acoustic, folk]

  - name: "❄️ Inverno Cozy"
    description: "Pra ficar em casa no friozinho. Atualizada a cada inverno."
    public: false
    size: 30
    seasons: [winter]
    queries:
      - "lofi chill"
      - "jazz café"
    genres: [jazz]

  - name: "🌸 Primavera Animada"
    description: "Leveza pra estação das flores. Atualizada a cada primavera."
    public: false
    size: 30
    seasons: [spring]
    queries:
      - "feel good indie pop"
      - "pop brasil animado"
    genres: [pop, indie-pop]

  - name: "🏋️ Treino da Semana"
    description: "Pique pra malhar. Renovada o ano todo."
    public: false
    size: 40
    seasons: [always]
    queries:
      - "workout hype"
      - "hip hop gym"
    genres: [hip-hop, electronic]

  - name: "🥁 Samba & Pagode — Descobertas"
    description: "Samba e pagode na sua vibe, com músicas novas pra você. Renovada o ano todo."
    public: false
    size: 30
    seasons: [always]
    # Modo descoberta: lê seus artistas mais ouvidos de samba/pagode,
    # puxa faixas parecidas no ritmo e EXCLUI o que você já escutou.
    mode: discovery
    seed_from_taste: true
    exclude_heard: true
    match_genres: [samba, pagode, "partido alto", "samba de raiz", "samba-enredo", "samba rock"]
    # Busca na mesma cena (caso falte semente do seu gosto, ou pra ampliar).
    # Texto puro funciona melhor que filtro de gênero para samba/pagode.
    queries:
      - "pagode"
      - "samba"
      - "pagode anos 90"
      - "samba de raiz"
      - "pagode romântico"
    # Reforço manual (opcional): edite com artistas que você curte.
    artist_seeds: []

  # =====================================================================
  # 🍷 DATE — clima agradável, longa e variada (agrada gregos e troianos)
  # =====================================================================
  - name: "🍷 Date — Clima Perfeito"
    description: "Trilha agradável e variada pra encontros. Mix MPB, bossa, soul e pop."
    public: false
    size: 70
    seasons: [always]
    mode: search
    queries:
      - "bossa nova clássicos"
      - "mpb romântico"
      - "soul classics"
      - "r&b slow jams"
      - "indie chill love"
      - "jazz vocal standards"
      - "pop acústico romântico"
      - "samba romântico"
      - "lo-fi jazzy"
    artist_seeds:
      - "Tim Maia"
      - "Marisa Monte"
      - "Djavan"
      - "João Gilberto"
      - "Caetano Veloso"
      - "Gilberto Gil"
      - "Jorge Ben Jor"
      - "Los Hermanos"
      - "Vanessa da Mata"
      - "Norah Jones"
      - "Sade"
      - "Frank Sinatra"
      - "Stevie Wonder"
      - "Bebel Gilberto"

  # =====================================================================
  # 🎤 KARAOKÊ BR — só músicas brasileiras, famosas de cantar, voz de barítono
  # =====================================================================
  - name: "🎤 Karaokê BR (voz de barítono)"
    description: "Clássicos brasileiros pra cantar junto, escolhidos pra voz de barítono."
    public: false
    size: 50
    seasons: [always]
    # Mistura seu gosto (artistas BR mais ouvidos) com os clássicos famosos
    # de karaokê. hits_only = só as músicas conhecidas, não faixas obscuras.
    mode: discovery
    seed_from_taste: true
    exclude_heard: false   # karaokê = músicas que você (e todos) conhecem
    hits_only: true
    match_genres: [mpb, samba, pagode, "rock nacional", "brazilian rock", sertanejo, "axé", "samba rock"]
    queries:
      - "clássicos mpb para cantar"
      - "rock nacional anos 80"
      - "músicas para cantar junto brasil"
    # Artistas brasileiros famosos de karaokê com pegada barítono/voz grave-média.
    artist_seeds:
      - "Roberto Carlos"
      - "Raul Seixas"
      - "Legião Urbana"
      - "Cazuza"
      - "Skank"
      - "Engenheiros do Hawaii"
      - "Jorge Aragão"
      - "Zeca Pagodinho"
      - "Belchior"
      - "Gonzaguinha"
      - "Lulu Santos"
      - "Nando Reis"
      - "Los Hermanos"
      - "Chico Buarque"
      - "Tim Maia"

  # =====================================================================
  # 🌅 BOM DIA — DIÁRIA às 5h: zera e põe 15 músicas novas pra motivar
  # =====================================================================
  - name: "🌅 Bom Dia, Motivação"
    description: "15 músicas novas pra começar o dia com o pé direito. Renovada todo dia às 5h."
    public: false
    size: 15
    seasons: [always]
    daily: true            # entra no fluxo diário (sync --daily), não no sazonal
    # Surpresa diária: semeia nos SEUS estilos, mas exclui o que você já ouviu
    # (pra ser sempre algo novo) e tira funk/rap e parentes.
    mode: discovery
    seed_from_taste: true
    exclude_heard: true
    match_genres: []       # todos os seus estilos...
    exclude_genres:        # ...menos estes:
      - funk
      - "funk carioca"
      - "funk brasileiro"
      - "funk mtg"
      - "funk ostentação"
      - rap
      - trap
      - "hip hop"
      - "brazilian hip hop"
      - drill
    queries:
      - "mpb animado"
      - "samba alegre"
      - "pop rock nacional"
      - "manhã boa vibe"
